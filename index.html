<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noras Lernwelt</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#25223a;background:#f7f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font-weight:850;font-size:25px;color:#7960d8}.sub{color:#74718a;font-size:13px}.hero{background:linear-gradient(120deg,#e9e2ff,#d7f8f2);border-radius:24px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:27px}.card{background:white;border:1px solid #ebe8f4;border-radius:19px;padding:20px;margin:13px 0;box-shadow:0 3px 14px #40346b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{cursor:pointer;text-align:left;font:inherit;border:1px solid #e8e4f2;background:white;border-radius:18px;padding:20px;min-height:110px}.tile:hover,.option:hover{border-color:#8973e5}.tile strong{display:block;margin:8px 0}.purple{color:#8973e5}.teal{color:#18a99d}.coral{color:#ed827a}button{cursor:pointer;font:inherit}.primary{background:#8973e5;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.secondary{background:#eeeafb;color:#6b54bd;border:0;border-radius:12px;padding:11px 16px}.option{display:block;width:100%;text-align:left;border:1px solid #e6e3ed;background:white;border-radius:12px;padding:13px;margin:9px 0}.option:disabled{opacity:.7;cursor:default}input[type=text]{font:inherit;padding:13px;border:1px solid #c9c4dc;border-radius:12px;width:100%;margin:10px 0}input:focus{outline:2px solid #8973e5}.bar{height:9px;border-radius:20px;background:#ece8f7;overflow:hidden;margin:12px 0}.fill{height:100%;background:#29bdb0}.feedback{padding:13px;border-radius:12px;background:#f1f9f6;margin:12px 0}.muted{color:#77738a}.small{font-size:13px}.row{display:flex;gap:10px;alig const app=document.getElementById('app');let state={mode:'home',items:[],i:0,correct:0,wrong:[],answered:false,attempts:0,topic:'',source:''};const key='noras_lernwelt_progress_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function englishHome(){state.mode='home';const total=Object.values(saved).reduce((a,b)=>a+b.count,0);app.innerHTML=`<section class="hero"><h1>Hallo Nora!</h1><p>${encouragementText()}</p><span class="pill">✦ ${total} abgeschlossene Lernrunden</span></section><h2>Was möchtest du heute üben?</h2><div class="grid"><button class="tile" onclick="vocabMenu()"><span class="teal">✎ Vokabeln</span><strong>Vocabulary Challenge</strong><span class="small muted">Lernen, schreiben, wiederholen</span></button><button class="tile" onclick="grammarMenu()"><span class="purple">▣ Grammatik</span><strong>Grammar Training</strong><span class="small muted">7 Themen mit Erklärungen</span></button><button class="tile" onclick="startReading()"><span class="coral">▤ Lesen</span><strong>Reading</strong><span class="small muted">Text und Fragen</span></button><button class="tile" onclick="startListening()"><span class="teal">♫ Hören</span><strong>Listening</strong><span class="small muted">Englischen Text anhören</span></button><button class="tile" onclick="exam()"><span class="coral">★ Test</span><strong>Schularbeitstraining</strong><span class="small muted">Gemischte Aufgaben</span></button></div><div class="card"><strong>Deine Lernreise</strong><p class="muted">${total?`Du hast bereits ${total} Lernrunden abgeschlossen. Weiter so!`:'Starte deine erste Lernrunde. Jeder Versuch zählt.'}</p></div>`}function vocabMenu(){app.innerHTML=`<button class="secondary" onclick="englishHome()">← Englisch</button><h2>Vocabulary Challenge</h2><p>${vocab.length} Wörter aus den fotografierten Vokabellisten. Bei einzelnen Übersetzungen wurde eine gebräuchliche Form gewählt.</p><div class="grid"><button class="tile" onclick="startVocab('learn')"><strong>Wörter entdecken</strong><span>Wort und Übersetzung aufdecken</span></button><button class="tile" onclick="startVocab('write')"><strong>Wörter schreiben</strong><span>Deutsch → Englisch</span></button><button class="tile" onclick="startVocab('reverse')"><strong>Englisch → Deutsch</strong><span>Übersetzung selbst eingeben</span></button><button class="tile" onclick="startVocab('mistakes')"><strong>Fehler wiederholen</strong><span>Zuletzt falsch beantwortete Wörter</span></button></div>`}function grammarMenu(){app.innerHTML='<button class="secondary" onclick="englishHome()">← Englisch</button><h2>Grammar Training</h2><p>Wähle ein Thema. Du bekommst eine kurze Erklärung und passende Übungen.</p><div class="grid">'+grammar.map((g,i)=>`<button class="tile" onclick="startGrammar(${i})"><strong>${esc(g.name)}</strong><span class="small muted">${g.q.length} mögliche Fragen · 8 pro Runde</span></button>`).join('')+'</div>'}function startVocab(mode){let words=mode==='mistakes'?vocab.filter(([en])=>(saved.mistakes||[]).includes(en)):shuffle(vocab).slice(0,12);if(!words.length){app.innerHTML='<div class="card">Noch keine Fehler gespeichert. Übe zuerst einige Wörter.</div><button class="secondary" onclick="vocabMenu()">Zurück</button>';return}state={mode:mode==='learn'?'learn':'quiz',source:'vocab',topic:'Vokabeln',items:words.map(([en,de])=>({q:mode==='reverse'?en:de,a:mode==='reverse'?de:en,en,de})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startGrammar(n){const g=grammar[n];state={mode:'quiz',source:'grammar',topic:g.name,tip:g.tip,items:shuffle(g.q).slice(0,8).map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startReading(){state={mode:'quiz',source:'reading',topic:reading.title,passage:reading.passage,items:reading.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startListening(){state={mode:'quiz',source:'listening',topic:listening.title,passage:listening.passage,items:listening.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function speak(){if(!('speechSynthesis'in window)){alert('Dein Browser unterstützt hier keine Sprachausgabe.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(state.passage);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function renderQuestion(){if(state.i>=state.items.length){finish();return}const x=state.items[state.i];const intro=state.source==='reading'?`<div class="card"><strong>Read the text:</strong><p>${esc(state.passage)}</p></div>`:state.source==='listening'?`<div class="card"><p>Höre den Text an und beantworte die Fragen.</p><button class="secondary" onclick="speak()">♫ Text abspielen</button><p class="small muted">Die Aussprache hängt von der Sprachausgabe deines Geräts ab.</p></div>`:'';app.innerHTML=`<button class="secondary" onclick="goBack()">← Zurück</button><h2>${esc(state.topic)}</h2>${state.tip?`<div class="card"><strong>Merke:</strong> ${esc(state.tip)}</div>`:''}${intro}<div class="card"><div class="row"><span class="pill">Frage ${state.i+1} von ${state.items.length}</span><span class="muted small">${state.correct} richtig</span></div><div class="bar"><div class="fill" style="width:${state.i/state.items.length*100}%"></div></div><div class="motivation">${encouragementText()}</div><h2>${esc(x.q)}</h2>${state.mode==='learn'?`<div id="solution" class="feedback hide"><strong>${esc(x.a)}</strong></div><div id="controls"><button class="primary" onclick="document.getElementById('solution').classList.remove('hide');document.getElementById('controls').innerHTML='<button class=&quot;primary&quot; onclick=&quot;nextLearn()&quot;>Nächstes Wort →</button>'">Antwort zeigen</button></div>`:`<form id="answerform" onsubmit="checkAnswer(event)"><label for="answer">Deine Antwort</label><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="Hier eintippen"><button class="primary" type="submit">Prüfen</button></form><div id="feedback"></div>`}</div>`}function goBack(){if(state.source==='grammar')grammarMenu();else if(state.source==='vocab')vocabMenu();else englishHome()}function nextLearn(){state.i++;renderQuestion()}function checkAnswer(e){e.preventDefault();if(state.answered)return;const x=state.items[state.i],val=document.getElementById('answer').value;let accepted=x.a.split(' / ').map(norm);if(x.a==='weiß')accepted.push('weiss');if(x.a==='die Treppe hinauf')accepted.push('hinauf');if(x.a==='die Treppe hinunter')accepted.push('hinunter');const ok=accepted.includes(norm(val));state.attempts=(state.attempts||0)+1;const feedback=document.getElementById('feedback');if(!ok&&state.attempts===1){feedback.innerHTML='<div class="feedback"><strong>Fast! Versuch es noch einmal.</strong><p>Achte auf Schreibweise, Wortform und Satzzeichen. Die Lösung bleibt noch geheim.</p></div>';document.getElementById('answer').focus();document.getElementById('answer').select();return}if(ok)state.correct++;else state.wrong.push(x);if(state.source==='vocab'){saved.mistakes=saved.mistakes||[];saved.mistakes=ok?saved.mistakes.filter(w=>w!==x.en):[...new Set([...saved.mistakes,x.en])];save()}state.answered=true;document.getElementById('answerform').querySelector('button').disabled=true;document.getElementById('answer').disabled=true;feedback.innerHTML=`<div class="feedback"><strong>${ok?'Richtig! Gut gemacht.':'Noch nicht ganz.'}</strong><p>${ok?'Gut gelöst!':'Richtige Antwort: <b>'+esc(x.a)+'</b>'}</p>${!ok?'<p>Vergleiche die Schreibweise mit deiner Antwort. Diese Aufgabe kannst du später wiederholen.</p>':''}</div><button class="primary" onclick="nextQuestion()">${state.i===state.items.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`}
function nextQuestion(){state.i++;state.answered=false;state.attempts=0;renderQuestion()}function finish(){if(state.mode==='learn'){app.innerHTML='<div class="card"><h2>Geschafft!</h2><p>Du hast alle Wörter dieser Runde angesehen.</p><button class="primary" onclick="vocabMenu()">Weiterlernen</button></div>';celebrate();return}saved[state.source]=saved[state.source]||{count:0,best:0};saved[state.source].count++;saved[state.source].best=Math.max(saved[state.source].best,Math.round(100*state.correct/state.items.length));save();app.innerHTML=`<div class="hero"><h1>Runde geschafft!</h1><p>Du hast die ganze Lernrunde geschafft!</p><p>${encouragementText()}</p></div>${state.wrong.length?`<div class="card"><h3>Das kannst du noch üben</h3>${state.wrong.map(x=>`<p>${esc(x.q)} → <strong>${esc(x.a)}</strong></p>`).join('')}</div>`:''}<div class="row"><button class="primary" onclick="home()">Zur Startseite</button><button class="secondary" onclick="${state.source==='vocab'?'vocabMenu()':state.source==='grammar'?'grammarMenu()':'englishHome()'}">Weiterüben</button></div>`;celebrate()}function exam(){let items=shuffle(grammar.flatMap(g=>g.q.map(([q,a])=>({q,a})))).slice(0,12);state={mode:'quiz',source:'exam',topic:'Schularbeitstraining',items,i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}

 const symbols={confetti:'🎉',swim:`<svg width="145" height="115" viewBox="0 0 145 115" aria-label="Rosa Axolotl"><path d="M95 76 Q128 92 137 54 Q132 100 98 94" fill="#f3a2b7" stroke="#c46e91" stroke-width="3"/><ellipse cx="82" cy="78" rx="35" ry="20" fill="#f9b8cb"/><path d="M44 58 L17 34 M42 49 L16 13 M52 45 L55 9 M105 56 L128 31 M106 67 L135 66" stroke="#ec789f" stroke-width="9" stroke-linecap="round"/><ellipse cx="66" cy="55" rx="42" ry="34" fill="#ffc7d6"/><circle cx="51" cy="49" r="4" fill="#463448"/><circle cx="80" cy="49" r="4" fill="#463448"/><path d="M57 65 Q66 72 76 65" fill="none" stroke="#9d5774" stroke-width="2.5" stroke-linecap="round"/></svg>`,sparkle:'💎'};
 const captions={confetti:'Konfetti für deinen Einsatz!',swim:'Dein Axolotl schwimmt eine Ehrenrunde!',sparkle:'Deine Kristalle funkeln für dich!'};
 let overlay=document.createElement('div');overlay.className='celebration';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');
 let particles=Array.from({length:24},(_,i)=>`<i style="--x:${(i*37)%100}%;--c:${['#8973e5','#29bdb0','#ed827a','#ffc65a'][i%4]};--r:${i*17}deg;--d:${2+(i%4)*.4}s;--delay:-${(i%5)*.5}s"></i>`).join('');
 overlay.innerHTML=`<div class="celebration-card"><h2>Runde geschafft!</h2><p>${encouragementText()}</p><div class="celebration-stage ${type}"><span class="figure" aria-hidden="true">${symbols[type]}</span><div class="particles">${particles}</div></div><p>${captions[type]}</p><button class="primary" id="celebrateclose">Weiterlernen →</button></div>`;
 document.body.appendChild(overlay);document.getElementById('celebrateclose').onclick=()=>overlay.remove();document.getElementById('celebrateclose').focus();
}
</script>
<style>
.subject-tile{min-height:180px;background:linear-gradient(145deg,#fff,#f0edff);font-size:18px}.subject-tile.math{background:linear-gradient(145deg,#fff,#dff9f4)}.subject-tile .big{font-size:45px;display:block;margin-bottom:10px}.math-steps{background:#f0fbf8;border-radius:15px;padding:16px;line-height:1.65}.math-steps strong{color:#176b64}.math-example{border-left:4px solid #29bdb0;padding:12px 16px;background:#f4fcfa;border-radius:10px;white-space:pre-line;line-height:1.6}.math-hint{background:#fff4e9;border-radius:12px;padding:13px;margin:10px 0}.math-topic{display:flex;align-items:center;gap:12px}.math-topic .letter{background:#eae4ff;color:#674ac5;border-radius:12px;min-width:38px;text-align:center;padding:9px;font-weight:800}.math-badge{font-size:12px;color:#716a85}.math-note{font-size:13px;color:#77738a}.math-answer{font-size:18px}.math-answer input{max-width:360px}.subject-nav{margin-bottom:14px}
</style>
<script>
// Die Mathematikaufgaben sind eigenständig erstellt, keine Kopien aus dem Schulbuch.
const mathTopics=[
 {letter:'A',name:'Natürliche Zahlen',intro:'Zahlen sind wie Adressen auf einem Zahlenstrahl. Jede Zahl hat ihren Platz.',steps:'1. Lies die Aufgabe langsam.\n2. Vergleiche die Stellenwerte: Tausender, Hunderter, Zehner, Einer.\n3. Prüfe, ob dein Ergebnis zur Frage passt.',example:'Bei 3 482 bedeutet die 4: vier Hunderter, also 400.',hint:'Schau dir die Ziffern von links nach rechts an.'},
 {letter:'B',name:'Rechnen mit natürlichen Zahlen',intro:'Plus, Minus, Mal und Geteilt sind vier Werkzeuge. Du entscheidest, welches du brauchst.',steps:'1. Finde die Rechenart.\n2. Rechne in kleinen Schritten.\n3. Kontrolliere mit der Umkehraufgabe.',example:'36 + 27 = 36 + 20 + 7 = 63.',hint:'Zerlege die Zahlen in Zehner und Einer.'},
 {letter:'C',name:'Dezimalzahlen und Maße',intro:'Das Komma trennt ganze Zahlen von Teilen eines Ganzen. Maße kann man umwandeln.',steps:'1. Achte auf die Einheit.\n2. 1 Meter sind 100 Zentimeter.\n3. Beim Umrechnen hilft eine kleine Tabelle.',example:'2,5 m = 250 cm. Denn 2 m sind 200 cm und 0,5 m sind 50 cm.',hint:'Von Metern zu Zentimetern mal 100 rechnen.'},
 {letter:'D',name:'Rechnen mit Dezimalzahlen',intro:'Bei Kommazahlen hilft es, das Komma sauber untereinander zu schreiben.',steps:'1. Schreibe die Zahlen stellenrichtig.\n2. Rechne wie mit ganzen Zahlen.\n3. Setze das Komma an die richtige Stelle.',example:'1,20 + 0,35 = 1,55.',hint:'Denke an Euro und Cent.'},
 {letter:'E',name:'Bruchzahlen',intro:'Ein Bruch zeigt, wie viele gleich große Stücke du von einem Ganzen hast.',steps:'1. Unten steht, in wie viele Stücke geteilt wird.\n2. Oben steht, wie viele Stücke du nimmst.\n3. Beim gleichen Nenner kannst du die Zähler addieren.',example:'1/4 + 2/4 = 3/4. Das sind drei von vier gleich großen Stücken.',hint:'Der Nenner bleibt gleich, wenn du gleichnamige Brüche addierst.'},
 {letter:'F',name:'Gleichungen und Formeln',intro:'Eine Gleichung ist wie eine Waage: Beide Seiten müssen gleich schwer sein.',steps:'1. Finde die unbekannte Zahl.\n2. Mache die Rechenoperation rückgängig.\n3. Setze deine Zahl zur Probe ein.',example:'x + 7 = 15 → x = 8, denn 8 + 7 = 15.',hint:'Welche Zahl macht die Gleichung richtig?'},
 {letter:'G',name:'Statistik und Baumdiagramme',intro:'Statistik hilft uns, Informationen zu ordnen und Möglichkeiten zu zählen.',steps:'1. Lies die Angaben genau.\n2. Sortiere die Werte oder Möglichkeiten.\n3. Zähle systematisch, damit du nichts vergisst.',example:'2 T-Shirts und 3 Hosen ergeben 2 · 3 = 6 Kombinationen.',hint:'Jede erste Möglichkeit mit jeder zweiten kombinieren.'},
 {letter:'H',name:'Einführung in die Geometrie',intro:'Geometrie beschreibt Formen und ihre Eigenschaften.',steps:'1. Schau dir die Form an.\n2. Zähle Seiten oder Ecken.\n3. Nutze die Eigenschaften der Figur.',example:'Ein Dreieck hat 3 Seiten und 3 Ecken.',hint:'Zeichne die Form gedanklich oder auf Papier.'},
 {letter:'I',name:'Geometrische Grundbegriffe',intro:'Strecken haben zwei Endpunkte. Ein Strahl beginnt an einem Punkt und geht weiter.',steps:'1. Achte auf die Beschreibung.\n2. Prüfe, ob es Endpunkte gibt.\n3. Unterscheide Strecke, Strahl und Gerade.',example:'Eine Strecke hat genau zwei Endpunkte.',hint:'Frage dich: Wie viele Endpunkte hat die Linie?'},
 {letter:'J',name:'Kreis',intro:'Bei einem Kreis sind alle Punkte am Rand gleich weit vom Mittelpunkt entfernt.',steps:'1. Der Radius geht vom Mittelpunkt zum Rand.\n2. Der Durchmesser geht durch die Mitte von Rand zu Rand.\n3. Durchmesser = 2 · Radius.',example:'Radius 4 cm → Durchmesser 8 cm.',hint:'Verdopple den Radius.'},
 {letter:'K',name:'Rechteck und Quadrat',intro:'Der Umfang ist der Weg außen herum. Die Fläche ist der Platz innen.',steps:'1. Umfang: alle Seiten addieren.\n2. Fläche Rechteck: Länge · Breite.\n3. Schreibe die Einheit dazu.',example:'Rechteck 5 cm × 3 cm: Fläche 15 cm², Umfang 16 cm.',hint:'Beim Umfang addieren, bei der Fläche multiplizieren.'},
 {letter:'L',name:'Maßstäbliches Zeichnen',intro:'Ein Maßstab verkleinert große Entfernungen, damit sie auf ein Blatt passen.',steps:'1. Lies den Maßstab.\n2. Bei 1 : 100 sind 1 cm auf dem Plan 100 cm in echt.\n3. Rechne Planmaß und Wirklichkeit passend um.',example:'1 : 100, 3 cm im Plan → 300 cm = 3 m in echt.',hint:'Bei 1 : 100 das Planmaß mit 100 multiplizieren.'},
 {letter:'M',name:'Quader und Würfel',intro:'Körper haben nicht nur Länge und Breite, sondern auch Höhe.',steps:'1. Finde Länge, Breite und Höhe.\n2. Volumen Quader = Länge · Breite · Höhe.\n3. Volumen hat Kubikeinheiten wie cm³.',example:'Quader 2 × 3 × 4 cm → 24 cm³.',hint:'Multipliziere die drei Kantenlängen.'}
];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function mathMake(idx){let a,b,c,d,q,answer,solution,unit='';switch(idx){
case 0:a=rnd(2,9);b=rnd(1,9);c=rnd(1,9);return {q:`Welche Zahl entsteht aus ${a} Hundertern, ${b} Zehnern und ${c} Einern?`,a:String(100*a+10*b+c),why:`${a} · 100 + ${b} · 10 + ${c} = ${100*a+10*b+c}`};
case 1:a=rnd(15,90);b=rnd(11,79);if(Math.random()<.5)return {q:`${a} + ${b} = ?`,a:String(a+b),why:`${a} + ${b} = ${a+b}`};return {q:`${a+b} − ${b} = ?`,a:String(a),why:`${a+b} − ${b} = ${a}`};
case 2:a=rnd(1,9);b=rnd(1,9);return {q:`${a},${b} m sind wie viele Zentimeter? (Nur Zahl eingeben)`,a:String(a*100+b*10),why:`1 m = 100 cm, also ${a},${b} m = ${a*100+b*10} cm.`};
case 3:a=rnd(10,80);b=rnd(10,80);return {q:`${(a/10).toFixed(1).replace('.',',')} + ${(b/10).toFixed(1).replace('.',',')} = ?`,a:((a+b)/10).toFixed(1).replace('.',','),why:`${a} Zehntel + ${b} Zehntel = ${a+b} Zehntel.`};
case 4:d=rnd(3,9);a=rnd(1,d-2);b=rnd(1,d-a);return {q:`${a}/${d} + ${b}/${d} = ? (Als Bruch eingeben)`,a:`${a+b}/${d}`,why:`Gleicher Nenner: ${a}+${b}=${a+b}, der Nenner ${d} bleibt.`};
case 5:a=rnd(2,24);b=rnd(3,20);return {q:`x + ${b} = ${a+b}. Wie groß ist x?`,a:String(a),why:`${a+b} − ${b} = ${a}. Probe: ${a} + ${b} = ${a+b}.`};
case 6:a=rnd(2,6);b=rnd(2,6);return {q:`Du hast ${a} T-Shirts und ${b} Hosen. Wie viele verschiedene Kombinationen sind möglich?`,a:String(a*b),why:`${a} · ${b} = ${a*b} Kombinationen.`};
case 7:a=rnd(3,8);return {q:`Ein Vieleck hat ${a} Seiten. Wie viele Ecken hat es?`,a:String(a),why:'Bei einem einfachen Vieleck gibt es genauso viele Ecken wie Seiten.'};
case 8:return {q:'Wie viele Endpunkte hat eine Strecke?',a:'2',why:'Eine Strecke beginnt und endet an je einem Punkt.'};
case 9:a=rnd(2,15);return {q:`Ein Kreis hat den Radius ${a} cm. Wie groß ist sein Durchmesser in cm?`,a:String(a*2),why:`2 · ${a} = ${a*2} cm.`};
case 10:a=rnd(2,12);b=rnd(2,12);if(Math.random()<.5)return {q:`Rechteck: ${a} cm lang, ${b} cm breit. Wie groß ist die Fläche in cm²?`,a:String(a*b),why:`${a} · ${b} = ${a*b} cm².`};return {q:`Rechteck: ${a} cm lang, ${b} cm breit. Wie groß ist der Umfang in cm?`,a:String(2*(a+b)),why:`2 · (${a} + ${b}) = ${2*(a+b)} cm.`};
case 11:a=rnd(2,9);b=[10,100,1000][rnd(0,2)];return {q:`Maßstab 1 : ${b}. Eine Strecke ist auf dem Plan ${a} cm lang. Wie lang ist sie in Wirklichkeit in cm?`,a:String(a*b),why:`${a} · ${b} = ${a*b} cm.`};
case 12:a=rnd(2,8);b=rnd(2,8);c=rnd(2,8);return {q:`Quader mit Kanten ${a} cm, ${b} cm und ${c} cm. Wie groß ist das Volumen in cm³?`,a:String(a*b*c),why:`${a} · ${b} · ${c} = ${a*b*c} cm³.`};
}}
let mathState=null;
function setBadge(t){const b=document.getElementById('subjectBadge');if(b)b.textContent=t}
function home(){state.mode='subjects';setBadge('Englisch & Mathematik');let total=Object.values(saved).filter(x=>x&&typeof x==='object'&&Number.isFinite(x.count)).reduce((n,x)=>n+x.count,0);app.innerHTML=`<section class="hero"><h1>Hallo Nora!</h1><p>${encouragementText()}</p><span class="pill">✦ ${total} abgeschlossene Lernrunden</span></section><h2>Was möchtest du heute lernen?</h2><div class="grid"><button class="tile subject-tile" onclick="englishHome();setBadge('Englisch · MORE! 1')"><span class="big">📚</span><strong>Englisch</strong><span class="muted small">Vokabeln, Grammatik, Lesen und Hören</span></button><button class="tile subject-tile math" onclick="mathHome()"><span class="big">📐</span><strong>Mathematik</strong><span class="muted small">Verstehen, ausprobieren und üben</span></button></div><div class="card"><strong>Deine Lernreise</strong><p class="muted">Du lernst in deinem Tempo. Jede abgeschlossene Runde zählt!</p></div>`}
function mathHome(){setBadge('Mathematik · Das ist Mathematik 1');app.innerHTML=`<button class="secondary subject-nav" onclick="home()">← Fächerauswahl</button><section class="hero"><h1>Mathe? Das schaffen wir!</h1><p>Erst verstehen, dann ausprobieren. Du darfst dir Zeit lassen.</p></section><h2>Deine Kapitel</h2><div class="grid">${mathTopics.map((t,i)=>`<button class="tile" onclick="mathChapter(${i})"><div class="math-topic"><span class="letter">${t.letter}</span><strong>${esc(t.name)}</strong></div><span class="math-badge">Einfach erklärt · Übungen</span></button>`).join('')}</div><h2>Schularbeitstraining</h2><div class="grid">${[1,2,3,4].map(n=>`<button class="tile" onclick="mathExam(${n})"><span class="coral">★ Training ${n}</span><strong>${n}. Schularbeit</strong><span class="small muted">Vorläufig gemischte Übungen. Den genauen Stoff ergänzen wir später.</span></button>`).join('')}</div>`}
function mathChapter(i){let t=mathTopics[i];mathState={chapter:i,exam:false};app.innerHTML=`<button class="secondary subject-nav" onclick="mathHome()">← Mathematikübersicht</button><h2>${t.letter} · ${esc(t.name)}</h2><div class="card"><h3>Das ist die Idee</h3><p>${esc(t.intro)}</p><div class="math-steps"><strong>So gehst du vor:</strong><p style="white-space:pre-line">${esc(t.steps)}</p></div><h3>Ein Beispiel</h3><div class="math-example">${esc(t.example)}</div><p class="muted small">Du musst nicht alles sofort können. Du kannst dir die Erklärung jederzeit noch einmal ansehen.</p><button class="primary" onclick="mathStart(${i})">Jetzt ausprobieren →</button></div>`}
function mathStart(i){mathState={chapter:i,exam:false,i:0,items:Array.from({length:8},()=>mathMake(i)),attempt:0,answered:false};mathQuestion()}
function mathExam(n){let pool= n===1?[0,1,2,3]:n===2?[3,4,5,6]:n===3?[6,7,8,9]:[9,10,11,12];mathState={exam:true,examNo:n,i:0,items:Array.from({length:10},()=>{let idx=pool[rnd(0,pool.length-1)];return {...mathMake(idx),chapter:idx}}),attempt:0,answered:false};mathQuestion()}
function mathBack(){if(mathState?.exam)mathHome();else mathChapter(mathState.chapter)}
function mathQuestion(){let s=mathState;if(s.i>=s.items.length){mathFinish();return}let t=s.exam?mathTopics[s.items[s.i].chapter]:mathTopics[s.chapter],item=s.items[s.i];app.innerHTML=`<button class="secondary subject-nav" onclick="mathBack()">← Zurück</button><h2>${s.exam?'Schularbeitstraining '+s.examNo:esc(t.name)}</h2><div class="card"><span class="pill">Aufgabe ${s.i+1} von ${s.items.length}</span><div class="bar"><div class="fill" style="width:${100*s.i/s.items.length}%"></div></div><div class="motivation">${encouragementText()}</div><h2>${esc(item.q)}</h2><form id="mathForm" onsubmit="mathCheck(event)"><label for="mathInput">Deine Antwort</label><input class="math-answer" id="mathInput" type="text" inputmode="decimal" autocomplete="off" required placeholder="Hier eintippen"><div class="row"><button class="primary" type="submit">Prüfen</button><button class="secondary" type="button" onclick="mathHint()">💡 Tipp</button></div></form><div id="mathFeedback" aria-live="polite"></div></div>`}
function mathHint(){let s=mathState,idx=s.exam?s.items[s.i].chapter:s.chapter;document.getElementById('mathFeedback').innerHTML=`<div class="math-hint">💡 ${esc(mathTopics[idx].hint)}</div>`}
function mathNorm(v){return v.trim().replace(/\s/g,'').replace('.',',')}
function mathCheck(e){e.preventDefault();let s=mathState,item=s.items[s.i],value=document.getElementById('mathInput').value;if(s.answered)return;s.attempt++;let ok=mathNorm(value)===mathNorm(item.a);let f=document.getElementById('mathFeedback');if(!ok&&s.attempt===1){f.innerHTML='<div class="math-hint">Das war noch nicht ganz richtig. Probier es noch einmal oder hol dir einen Tipp. Du schaffst das!</div>';document.getElementById('mathInput').focus();document.getElementById('mathInput').select();return}s.answered=true;document.getElementById('mathInput').disabled=true;document.querySelector('#mathForm button[type=submit]').disabled=true;f.innerHTML=`<div class="feedback"><strong>${ok?'Das passt!':'Gut, dass du es versucht hast!'}</strong><p>${ok?'Super weitergedacht.':'Die passende Antwort ist: <strong>'+esc(item.a)+'</strong>'}</p><p>${esc(item.why)}</p></div><button class="primary" onclick="mathNext()">${s.i===s.items.length-1?'Runde abschließen':'Weiter →'}</button>`}
function mathNext(){mathState.i++;mathState.attempt=0;mathState.answered=false;mathQuestion()}
function mathFinish(){let s=mathState;saved.math=saved.math||{count:0};saved.math.count++;save();app.innerHTML=`<div class="hero"><h1>Du hast es geschafft!</h1><p>${encouragementText()}</p><p>Du hast eine ganze Mathe-Lernrunde abgeschlossen. Das zählt!</p></div><div class="row"><button class="primary" onclick="${s.exam?'mathHome()':'mathChapter('+s.chapter+')'}">Weiterlernen</button><button class="secondary" onclick="mathHome()">Mathematikübersicht</button></div>`;celebrate()}
// Englisch: Zurück von der Fachübersicht zur Fächerauswahl.
const englishHomeOriginal=englishHome;
englishHome=function(){setBadge('Englisch · MORE! 1');englishHomeOriginal();let back=document.createElement('button');back.className='secondary subject-nav';back.textContent='← Fächerauswahl';back.onclick=home;app.prepend(back)};
</script>
<script>home();</script></body></html>
