<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noras Lernwelt</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#25223a;background:#f7f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font-weight:850;font-size:25px;color:#7960d8}.sub{color:#74718a;font-size:13px}.hero{background:linear-gradient(120deg,#e9e2ff,#d7f8f2);border-radius:24px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:27px}.card{background:white;border:1px solid #ebe8f4;border-radius:19px;padding:20px;margin:13px 0;box-shadow:0 3px 14px #40346b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{cursor:pointer;text-align:left;font:inherit;border:1px solid #e8e4f2;background:white;border-radius:18px;padding:20px;min-height:110px}.tile:hover,.option:hover{border-color:#8973e5}.tile strong{display:block;margin:8px 0}.purple{color:#8973e5}.teal{color:#18a99d}.coral{color:#ed827a}button{cursor:pointer;font:inherit}.primary{background:#8973e5;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.secondary{background:#eeeafb;color:#6b54bd;border:0;border-radius:12px;padding:11px 16px}.option{display:block;width:100%;text-align:left;border:1px solid #e6e3ed;background:white;border-radius:12px;padding:13px;margin:9px 0}.option:disabled{opacity:.7;cursor:default}input[type=text]{font:inherit;padding:13px;border:1px solid #c9c4dc;border-radius:12px;width:100%;margin:10px 0}input:focus{outline:2px solid #8973e5}.bar{height:9px;border-radius:20px;background:#ece8f7;overflow:hidden;margin:12px 0}.fill{height:100%;background:#29bdb0}.feedback{padding:13px;border-radius:12px;background:#f1f9f6;margin:12px 0}.muted{color:#77738a}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hide{display:none}.pill{display:inline-block;background:#eeeafb;color:#6b54bd;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}footer{margin-top:30px;color:#817e90;font-size:12px}</style></head><body><main class="wrap"><header><div><div class="logo">✦ Noras Lernwelt</div><div class="sub">Lernen. Üben. Verstehen.</div></div><span class="pill">Englisch · MORE! 1</span></header><div id="app"></div><footer>Deine Ergebnisse bleiben in diesem Browser gespeichert. Bei gelöschten Browserdaten können sie verloren gehen. Alle Übungen sind eigenständig erstellt.</footer></main><script>
const vocab=[['to spell','buchstabieren'],['colour','Farbe'],['to colour','ausmalen'],['red','rot'],['blue','blau'],['green','grün'],['yellow','gelb'],['orange','orange'],['brown','braun'],['black','schwarz'],['white','weiß'],['beige','beige'],['purple','lila'],['violet','violett'],['grey','grau'],['turquoise','türkis'],['silver','silber'],['golden','golden'],['light blue','hellblau'],['colourful','farbig'],['transparent','durchsichtig'],['to count','zählen'],['to clean','putzen'],['to choose','auswählen'],['answer','Antwort'],['question','Frage'],['to answer','antworten'],['to ask','fragen'],['to circle','einkreisen'],['true','wahr'],['false','falsch'],['right','richtig'],['wrong','falsch'],['upstairs','die Treppe hinauf'],['downstairs','die Treppe hinunter'],['lake','See'],['pond','Teich'],['sea','Meer'],['river','Fluss'],['during','während'],['to feel','fühlen'],['instruction','Anleitung'],['to tell','erzählen'],['accident','Unfall'],['to smoke','rauchen'],['to forget','vergessen'],['to tidy up','aufräumen'],['to use','benutzen'],['building','Gebäude'],['to build','bauen'],['inside','drinnen'],['outside','draußen'],['bedroom','Schlafzimmer'],['restroom','WC'],['bless you','Gesundheit'],['pencil case','Federpennal'],['pen','Füllfeder'],['biros','Kugelschreiber'],['projector','Beamer'],['sound system','Soundsystem'],['floor','Boden'],['ground','Boden draußen'],['ceiling','Decke'],['blanket','Bettdecke'],['key','Schlüssel'],['locker','Spind'],['shelf','Regal'],['thief','Dieb'],['leaf','Blatt'],['sheet of paper','Blatt Papier'],['roof','Dach'],['cliff','Klippe'],['handkerchief','Taschentuch'],['scarf','Schal'],['dwarf','Zwerg'],['gnome','Zwerg'],['wife','Ehefrau'],['woman','Frau'],['louse','Laus'],['goose','Gans'],['ox','Ochse'],['deer','Reh'],['trousers','Hose'],['shorts','kurze Hose'],['pants','Hose'],['tights','Strumpfhose'],['glasses','Brille'],['scissors','Schere'],['to attend','besuchen'],['to visit','besuchen'],['guinea pig','Meerschweinchen'],['spinach','Spinat'],['broccoli','Brokkoli'],['to study for','für etwas lernen'],['busy','beschäftigt'],['forest','Wald'],['owl','Eule'],['playground','Spielplatz'],['fish tank','Aquarium'],['carpet','Teppich'],['curtain','Vorhang'],['rug','Teppichvorleger']];
const grammar=[{name:'Plural of nouns',tip:'Meist kommt -s dazu. Nach -s, -sh, -ch und -x oft -es. Manche Wörter sind unregelmäßig.',q:[['One book, two ___','books'],['One box, two ___','boxes'],['One child, two ___','children'],['One goose, two ___','geese'],['One woman, two ___','women']]},{name:'Questions',tip:'Bei to be steht am, is oder are am Satzanfang. Mit Fragewort: Where are you?',q:[['___ is your name?','what'],['___ are you from?','where'],['___ old are you?','how'],['___ is your favourite colour?','what']]},{name:'Personal pronouns',tip:'I, you, he, she, it, we, you, they. Ersetze Namen durch das passende Pronomen.',q:[['Tom is my friend. ___ is funny.','he'],['Anna is eleven. ___ is in my class.','she'],['My friends are here. ___ are happy.','they'],['My sister and I are pupils. ___ are pupils.','we']]},{name:'Numbers',tip:'Achte auf die Schreibweise: thirteen und thirty sind verschieden.',q:[['12 = ___','twelve'],['15 = ___','fifteen'],['20 = ___','twenty'],['30 = ___','thirty'],['40 = ___','forty']]},{name:'Imperative',tip:'Aufforderung: Open the book! Verneinung: Don’t open the book!',q:[['___ your book! (öffnen)','open'],['___ quiet! (sein)','be'],['___ run! (nicht)','don’t'],['___ down! (sich setzen)','sit']]},{name:'To be',tip:'I am, you are, he/she/it is, we/you/they are. Verneinung mit not.',q:[['I ___ eleven.','am'],['She ___ my friend.','is'],['They ___ at school.','are'],['___ you happy?','are'],['He ___ not tired.','is']]},{name:'There is / there are',tip:'There is für eine Sache, there are für mehrere Sachen.',q:[['There ___ a book on the table.','is'],['There ___ three pens in my bag.','are'],['___ there a cat in the room?','is'],['There ___ two windows.','are']]}];
const reading={title:'Reading: A new classroom',passage:'Hello! My name is Mia. I am eleven years old. My classroom is big. There are twenty pupils in my class. There is a green board and there are three windows. My best friend is Ben. He is twelve. We like English.',q:[['How old is Mia?','eleven'],['How many pupils are in her class?','twenty'],['What colour is the board?','green'],['Who is Mia’s best friend?','ben']]};
const listening={title:'Listening: My room',passage:'Hello, I am Sam. I am eleven. There is a bed in my room. There are two books on my shelf. My schoolbag is blue. I like my room.',q:[['How old is Sam?','eleven'],['How many books are on the shelf?','two'],['What colour is the schoolbag?','blue']]};
const app=document.getElementById('app');let state={mode:'home',items:[],i:0,correct:0,wrong:[],answered:false,attempts:0,topic:'',source:''};const key='noras_lernwelt_progress_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function home(){state.mode='home';const total=Object.values(saved).reduce((a,b)=>a+b.count,0);app.innerHTML=`<section class="hero"><h1>Hallo Nora!</h1><p>Jeden Tag ein bisschen besser. Du lernst in deinem Tempo.</p><span class="pill">✦ ${total} abgeschlossene Lernrunden</span></section><h2>Was möchtest du heute üben?</h2><div class="grid"><button class="tile" onclick="vocabMenu()"><span class="teal">✎ Vokabeln</span><strong>Vocabulary Challenge</strong><span class="small muted">Lernen, schreiben, wiederholen</span></button><button class="tile" onclick="grammarMenu()"><span class="purple">▣ Grammatik</span><strong>Grammar Training</strong><span class="small muted">7 Themen mit Erklärungen</span></button><button class="tile" onclick="startReading()"><span class="coral">▤ Lesen</span><strong>Reading</strong><span class="small muted">Text und Fragen</span></button><button class="tile" onclick="startListening()"><span class="teal">♫ Hören</span><strong>Listening</strong><span class="small muted">Englischen Text anhören</span></button><button class="tile" onclick="writing()"><span class="purple">✍ Schreiben</span><strong>Writing Practice</strong><span class="small muted">Eine Person vorstellen</span></button><button class="tile" onclick="exam()"><span class="coral">★ Test</span><strong>Schularbeitstraining</strong><span class="small muted">Gemischte Aufgaben</span></button></div><div class="card"><strong>Deine Lernreise</strong><p class="muted">${total?`Du hast bereits ${total} Lernrunden abgeschlossen. Weiter so!`:'Starte deine erste Lernrunde. Jeder Versuch zählt.'}</p></div>`}function vocabMenu(){app.innerHTML=`<button class="secondary" onclick="home()">← Startseite</button><h2>Vocabulary Challenge</h2><p>${vocab.length} Wörter aus den fotografierten Vokabellisten. Bei einzelnen Übersetzungen wurde eine gebräuchliche Form gewählt.</p><div class="grid"><button class="tile" onclick="startVocab('learn')"><strong>Wörter entdecken</strong><span>Wort und Übersetzung aufdecken</span></button><button class="tile" onclick="startVocab('write')"><strong>Wörter schreiben</strong><span>Deutsch → Englisch</span></button><button class="tile" onclick="startVocab('reverse')"><strong>Englisch → Deutsch</strong><span>Übersetzung selbst eingeben</span></button><button class="tile" onclick="startVocab('mistakes')"><strong>Fehler wiederholen</strong><span>Zuletzt falsch beantwortete Wörter</span></button></div>`}function grammarMenu(){app.innerHTML='<button class="secondary" onclick="home()">← Startseite</button><h2>Grammar Training</h2><p>Wähle ein Thema. Du bekommst eine kurze Erklärung und passende Übungen.</p><div class="grid">'+grammar.map((g,i)=>`<button class="tile" onclick="startGrammar(${i})"><strong>${esc(g.name)}</strong><span class="small muted">${g.q.length} Fragen</span></button>`).join('')+'</div>'}function startVocab(mode){let words=mode==='mistakes'?vocab.filter(([en])=>(saved.mistakes||[]).includes(en)):shuffle(vocab).slice(0,12);if(!words.length){app.innerHTML='<div class="card">Noch keine Fehler gespeichert. Übe zuerst einige Wörter.</div><button class="secondary" onclick="vocabMenu()">Zurück</button>';return}state={mode:mode==='learn'?'learn':'quiz',source:'vocab',topic:'Vokabeln',items:words.map(([en,de])=>({q:mode==='reverse'?en:de,a:mode==='reverse'?de:en,en,de})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startGrammar(n){const g=grammar[n];state={mode:'quiz',source:'grammar',topic:g.name,tip:g.tip,items:shuffle(g.q).map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startReading(){state={mode:'quiz',source:'reading',topic:reading.title,passage:reading.passage,items:reading.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startListening(){state={mode:'quiz',source:'listening',topic:listening.title,passage:listening.passage,items:listening.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function speak(){if(!('speechSynthesis'in window)){alert('Dein Browser unterstützt hier keine Sprachausgabe.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(state.passage);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function renderQuestion(){if(state.i>=state.items.length){finish();return}const x=state.items[state.i];const intro=state.source==='reading'?`<div class="card"><strong>Read the text:</strong><p>${esc(state.passage)}</p></div>`:state.source==='listening'?`<div class="card"><p>Höre den Text an und beantworte die Fragen.</p><button class="secondary" onclick="speak()">♫ Text abspielen</button><p class="small muted">Die Aussprache hängt von der Sprachausgabe deines Geräts ab.</p></div>`:'';app.innerHTML=`<button class="secondary" onclick="goBack()">← Zurück</button><h2>${esc(state.topic)}</h2>${state.tip?`<div class="card"><strong>Merke:</strong> ${esc(state.tip)}</div>`:''}${intro}<div class="card"><div class="row"><span class="pill">Frage ${state.i+1} von ${state.items.length}</span><span class="muted small">${state.correct} richtig</span></div><div class="bar"><div class="fill" style="width:${state.i/state.items.length*100}%"></div></div><h2>${esc(x.q)}</h2>${state.mode==='learn'?`<div id="solution" class="feedback hide"><strong>${esc(x.a)}</strong></div><div id="controls"><button class="primary" onclick="document.getElementById('solution').classList.remove('hide');document.getElementById('controls').innerHTML='<button class=&quot;primary&quot; onclick=&quot;nextLearn()&quot;>Nächstes Wort →</button>'">Antwort zeigen</button></div>`:`<form id="answerform" onsubmit="checkAnswer(event)"><label for="answer">Deine Antwort</label><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="Hier eintippen"><button class="primary" type="submit">Prüfen</button></form><div id="feedback"></div>`}</div>`}function goBack(){if(state.source==='grammar')grammarMenu();else if(state.source==='vocab')vocabMenu();else home()}function nextLearn(){state.i++;renderQuestion()}function checkAnswer(e){e.preventDefault();if(state.answered)return;const x=state.items[state.i],val=document.getElementById('answer').value;let accepted=x.a.split(' / ').map(norm);if(x.a==='weiß')accepted.push('weiss');if(x.a==='die Treppe hinauf')accepted.push('hinauf');if(x.a==='die Treppe hinunter')accepted.push('hinunter');const ok=accepted.includes(norm(val));state.attempts=(state.attempts||0)+1;const feedback=document.getElementById('feedback');if(!ok&&state.attempts===1){feedback.innerHTML='<div class="feedback"><strong>Fast! Versuch es noch einmal.</strong><p>Achte auf Schreibweise, Wortform und Satzzeichen. Die Lösung bleibt noch geheim.</p></div>';document.getElementById('answer').focus();document.getElementById('answer').select();return}if(ok)state.correct++;else state.wrong.push(x);if(state.source==='vocab'){saved.mistakes=saved.mistakes||[];saved.mistakes=ok?saved.mistakes.filter(w=>w!==x.en):[...new Set([...saved.mistakes,x.en])];save()}state.answered=true;document.getElementById('answerform').querySelector('button').disabled=true;document.getElementById('answer').disabled=true;feedback.innerHTML=`<div class="feedback"><strong>${ok?'Richtig! Gut gemacht.':'Noch nicht ganz.'}</strong><p>${ok?'Gut gelöst!':'Richtige Antwort: <b>'+esc(x.a)+'</b>'}</p>${!ok?'<p>Vergleiche die Schreibweise mit deiner Antwort. Diese Aufgabe kannst du später wiederholen.</p>':''}</div><button class="primary" onclick="nextQuestion()">${state.i===state.items.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`}
function nextQuestion(){state.i++;state.answered=false;state.attempts=0;renderQuestion()}function finish(){if(state.mode==='learn'){app.innerHTML='<div class="card"><h2>Geschafft!</h2><p>Du hast alle Wörter dieser Runde angesehen.</p><button class="primary" onclick="vocabMenu()">Weiterlernen</button></div>';return}saved[state.source]=saved[state.source]||{count:0,best:0};saved[state.source].count++;saved[state.source].best=Math.max(saved[state.source].best,Math.round(100*state.correct/state.items.length));save();app.innerHTML=`<div class="hero"><h1>Runde geschafft!</h1><p>Du hast <strong>${state.correct} von ${state.items.length}</strong> Aufgaben richtig beantwortet.</p><p>${state.correct===state.items.length?'Super! Du hast alles richtig.':'Übung macht den Unterschied. Weiter so!'}</p></div>${state.wrong.length?`<div class="card"><h3>Das kannst du noch üben</h3>${state.wrong.map(x=>`<p>${esc(x.q)} → <strong>${esc(x.a)}</strong></p>`).join('')}</div>`:''}<div class="row"><button class="primary" onclick="home()">Zur Startseite</button><button class="secondary" onclick="${state.source==='vocab'?'vocabMenu()':state.source==='grammar'?'grammarMenu()':'home()'}">Weiterüben</button></div>`}function writing(){app.innerHTML=`<button class="secondary" onclick="goBack()">← Zurück</button><div class="card"><h2>Writing Practice</h2><p><strong>Task:</strong> Introduce yourself or a friend. Write at least five sentences.</p><p class="muted">Hilfen: My name is ... / I am ... years old. / I am from ... / My favourite colour is ... / My friend is ...</p><textarea id="writing" rows="8" style="width:100%;border:1px solid #c9c4dc;border-radius:12px;padding:12px;font:inherit" placeholder="My name is ..."></textarea><p><button class="primary" onclick="checkWriting()">Meine Checkliste anzeigen</button></p><div id="writingfeedback"></div></div>`}function checkWriting(){const t=document.getElementById('writing').value.trim();const count=t.split(/[.!?]+/).filter(x=>x.trim()).length;const notes=[];const suggest=(regex,message)=>{if(regex.test(t))notes.push(message)};suggest(/\bgren\b/i,'„gren“ ist vermutlich „green“.');suggest(/\b(?:my|your|his|her|our|their)\s+name\s+is\b/i,'Gut: Du verwendest „name is“.');suggest(/\byou\s+(?:am|is)\b/i,'Bei „you“ heißt es „are“, nicht „am“ oder „is“.');suggest(/\b(?:he|she|it)\s+(?:am|are)\b/i,'Bei „he“, „she“ und „it“ heißt es „is“.');suggest(/\bi\s+(?:is|are)\b/i,'Bei „I“ heißt es „am“.');suggest(/\b(?:my|his|her)\s+fathers?\s+nam\b/i,'Schreibe „father’s name“ mit Apostroph und „name“ mit e.');suggest(/\bnam\s+is\b/i,'„nam“ muss „name“ heißen.');suggest(/\b(?:favourite|favorite)\s+colou?r\s+is\s+gren\b/i,'Die Farbe heißt „green“.');suggest(/\bmy\s+friend\s+was\b/i,'Wenn du deine Freundin jetzt vorstellst, verwende „is“ statt „was“.');const sentences=t.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);for(const sentence of sentences){if(/^[a-z]/.test(sentence))notes.push('Ein Satz beginnt mit einem Großbuchstaben: „'+esc(sentence.slice(0,22))+'…“');if(/\bi\b/.test(sentence))notes.push('Das persönliche Fürwort „I“ wird immer großgeschrieben.')}if(t&&!/[.!?]$/.test(t))notes.push('Am Ende fehlt ein Satzzeichen.');if(count<5)notes.push('Schreibe mindestens fünf Sätze.');const errors=notes.filter(n=>!n.startsWith('Gut:'));document.getElementById('writingfeedback').innerHTML=`<div class="feedback"><strong>Schreibcheck</strong><p>${count} Sätze erkannt.</p>${errors.length?'<p><strong>Das solltest du prüfen:</strong></p><ul>'+[...new Set(errors)].map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p>Keine der hinterlegten typischen Fehlerstellen erkannt.</p>'}<p class="small">Dieser Offline-Check erkennt nur bestimmte typische Fehler. Er kann keine vollständige Grammatik- oder Rechtschreibkorrektur ersetzen. Auch unerkannte Fehler sind möglich.</p></div>`}
function exam(){let items=shuffle(grammar.flatMap(g=>g.q.map(([q,a])=>({q,a})))).slice(0,12);state={mode:'quiz',source:'exam',topic:'Schularbeitstraining',items,i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}home();</script></body></html>
