<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noras Lernwelt</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#25223a;background:#f7f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font-weight:850;font-size:25px;color:#7960d8}.sub{color:#74718a;font-size:13px}.hero{background:linear-gradient(120deg,#e9e2ff,#d7f8f2);border-radius:24px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:27px}.card{background:white;border:1px solid #ebe8f4;border-radius:19px;padding:20px;margin:13px 0;box-shadow:0 3px 14px #40346b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{cursor:pointer;text-align:left;font:inherit;border:1px solid #e8e4f2;background:white;border-radius:18px;padding:20px;min-height:110px}.tile:hover,.option:hover{border-color:#8973e5}.tile strong{display:block;margin:8px 0}.purple{color:#8973e5}.teal{color:#18a99d}.coral{color:#ed827a}button{cursor:pointer;font:inherit}.primary{background:#8973e5;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.secondary{background:#eeeafb;color:#6b54bd;border:0;border-radius:12px;padding:11px 16px}.option{display:block;width:100%;text-align:left;border:1px solid #e6e3ed;background:white;border-radius:12px;padding:13px;margin:9px 0}.option:disabled{opacity:.7;cursor:default}input[type=text]{font:inherit;padding:13px;border:1px solid #c9c4dc;border-radius:12px;width:100%;margin:10px 0}input:focus{outline:2px solid #8973e5}.bar{height:9px;border-radius:20px;background:#ece8f7;overflow:hidden;margin:12px 0}.fill{height:100%;background:#29bdb0}.feedback{padding:13px;border-radius:12px;background:#f1f9f6;margin:12px 0}.muted{color:#77738a}.small{font-size:13px}.row{display:flex;gap:10px;alig const app=document.getElementById('app');let state={mode:'home',items:[],i:0,correct:0,wrong:[],answered:false,attempts:0,topic:'',source:''};const key='noras_lernwelt_progress_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function home(){state.mode='home';const total=Object.values(saved).reduce((a,b)=>a+b.count,0);app.innerHTML=`<section class="hero"><h1>Hallo Nora!</h1><p>${encouragementText()}</p><span class="pill">✦ ${total} abgeschlossene Lernrunden</span></section><h2>Was möchtest du heute üben?</h2><div class="grid"><button class="tile" onclick="vocabMenu()"><span class="teal">✎ Vokabeln</span><strong>Vocabulary Challenge</strong><span class="small muted">Lernen, schreiben, wiederholen</span></button><button class="tile" onclick="grammarMenu()"><span class="purple">▣ Grammatik</span><strong>Grammar Training</strong><span class="small muted">7 Themen mit Erklärungen</span></button><button class="tile" onclick="startReading()"><span class="coral">▤ Lesen</span><strong>Reading</strong><span class="small muted">Text und Fragen</span></button><button class="tile" onclick="startListening()"><span class="teal">♫ Hören</span><strong>Listening</strong><span class="small muted">Englischen Text anhören</span></button><button class="tile" onclick="exam()"><span class="coral">★ Test</span><strong>Schularbeitstraining</strong><span class="small muted">Gemischte Aufgaben</span></button></div><div class="card"><strong>Deine Lernreise</strong><p class="muted">${total?`Du hast bereits ${total} Lernrunden abgeschlossen. Weiter so!`:'Starte deine erste Lernrunde. Jeder Versuch zählt.'}</p></div>`}function vocabMenu(){app.innerHTML=`<button class="secondary" onclick="home()">← Startseite</button><h2>Vocabulary Challenge</h2><p>${vocab.length} Wörter aus den fotografierten Vokabellisten. Bei einzelnen Übersetzungen wurde eine gebräuchliche Form gewählt.</p><div class="grid"><button class="tile" onclick="startVocab('learn')"><strong>Wörter entdecken</strong><span>Wort und Übersetzung aufdecken</span></button><button class="tile" onclick="startVocab('write')"><strong>Wörter schreiben</strong><span>Deutsch → Englisch</span></button><button class="tile" onclick="startVocab('reverse')"><strong>Englisch → Deutsch</strong><span>Übersetzung selbst eingeben</span></button><button class="tile" onclick="startVocab('mistakes')"><strong>Fehler wiederholen</strong><span>Zuletzt falsch beantwortete Wörter</span></button></div>`}function grammarMenu(){app.innerHTML='<button class="secondary" onclick="home()">← Startseite</button><h2>Grammar Training</h2><p>Wähle ein Thema. Du bekommst eine kurze Erklärung und passende Übungen.</p><div class="grid">'+grammar.map((g,i)=>`<button class="tile" onclick="startGrammar(${i})"><strong>${esc(g.name)}</strong><span class="small muted">${g.q.length} mögliche Fragen · 8 pro Runde</span></button>`).join('')+'</div>'}function startVocab(mode){let words=mode==='mistakes'?vocab.filter(([en])=>(saved.mistakes||[]).includes(en)):shuffle(vocab).slice(0,12);if(!words.length){app.innerHTML='<div class="card">Noch keine Fehler gespeichert. Übe zuerst einige Wörter.</div><button class="secondary" onclick="vocabMenu()">Zurück</button>';return}state={mode:mode==='learn'?'learn':'quiz',source:'vocab',topic:'Vokabeln',items:words.map(([en,de])=>({q:mode==='reverse'?en:de,a:mode==='reverse'?de:en,en,de})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startGrammar(n){const g=grammar[n];state={mode:'quiz',source:'grammar',topic:g.name,tip:g.tip,items:shuffle(g.q).slice(0,8).map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startReading(){state={mode:'quiz',source:'reading',topic:reading.title,passage:reading.passage,items:reading.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function startListening(){state={mode:'quiz',source:'listening',topic:listening.title,passage:listening.passage,items:listening.q.map(([q,a])=>({q,a})),i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}function speak(){if(!('speechSynthesis'in window)){alert('Dein Browser unterstützt hier keine Sprachausgabe.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(state.passage);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function renderQuestion(){if(state.i>=state.items.length){finish();return}const x=state.items[state.i];const intro=state.source==='reading'?`<div class="card"><strong>Read the text:</strong><p>${esc(state.passage)}</p></div>`:state.source==='listening'?`<div class="card"><p>Höre den Text an und beantworte die Fragen.</p><button class="secondary" onclick="speak()">♫ Text abspielen</button><p class="small muted">Die Aussprache hängt von der Sprachausgabe deines Geräts ab.</p></div>`:'';app.innerHTML=`<button class="secondary" onclick="goBack()">← Zurück</button><h2>${esc(state.topic)}</h2>${state.tip?`<div class="card"><strong>Merke:</strong> ${esc(state.tip)}</div>`:''}${intro}<div class="card"><div class="row"><span class="pill">Frage ${state.i+1} von ${state.items.length}</span><span class="muted small">${state.correct} richtig</span></div><div class="bar"><div class="fill" style="width:${state.i/state.items.length*100}%"></div></div><div class="motivation">${encouragementText()}</div><h2>${esc(x.q)}</h2>${state.mode==='learn'?`<div id="solution" class="feedback hide"><strong>${esc(x.a)}</strong></div><div id="controls"><button class="primary" onclick="document.getElementById('solution').classList.remove('hide');document.getElementById('controls').innerHTML='<button class=&quot;primary&quot; onclick=&quot;nextLearn()&quot;>Nächstes Wort →</button>'">Antwort zeigen</button></div>`:`<form id="answerform" onsubmit="checkAnswer(event)"><label for="answer">Deine Antwort</label><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="Hier eintippen"><button class="primary" type="submit">Prüfen</button></form><div id="feedback"></div>`}</div>`}function goBack(){if(state.source==='grammar')grammarMenu();else if(state.source==='vocab')vocabMenu();else home()}function nextLearn(){state.i++;renderQuestion()}function checkAnswer(e){e.preventDefault();if(state.answered)return;const x=state.items[state.i],val=document.getElementById('answer').value;let accepted=x.a.split(' / ').map(norm);if(x.a==='weiß')accepted.push('weiss');if(x.a==='die Treppe hinauf')accepted.push('hinauf');if(x.a==='die Treppe hinunter')accepted.push('hinunter');const ok=accepted.includes(norm(val));state.attempts=(state.attempts||0)+1;const feedback=document.getElementById('feedback');if(!ok&&state.attempts===1){feedback.innerHTML='<div class="feedback"><strong>Fast! Versuch es noch einmal.</strong><p>Achte auf Schreibweise, Wortform und Satzzeichen. Die Lösung bleibt noch geheim.</p></div>';document.getElementById('answer').focus();document.getElementById('answer').select();return}if(ok)state.correct++;else state.wrong.push(x);if(state.source==='vocab'){saved.mistakes=saved.mistakes||[];saved.mistakes=ok?saved.mistakes.filter(w=>w!==x.en):[...new Set([...saved.mistakes,x.en])];save()}state.answered=true;document.getElementById('answerform').querySelector('button').disabled=true;document.getElementById('answer').disabled=true;feedback.innerHTML=`<div class="feedback"><strong>${ok?'Richtig! Gut gemacht.':'Noch nicht ganz.'}</strong><p>${ok?'Gut gelöst!':'Richtige Antwort: <b>'+esc(x.a)+'</b>'}</p>${!ok?'<p>Vergleiche die Schreibweise mit deiner Antwort. Diese Aufgabe kannst du später wiederholen.</p>':''}</div><button class="primary" onclick="nextQuestion()">${state.i===state.items.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`}
function nextQuestion(){state.i++;state.answered=false;state.attempts=0;renderQuestion()}function finish(){if(state.mode==='learn'){app.innerHTML='<div class="card"><h2>Geschafft!</h2><p>Du hast alle Wörter dieser Runde angesehen.</p><button class="primary" onclick="vocabMenu()">Weiterlernen</button></div>';celebrate();return}saved[state.source]=saved[state.source]||{count:0,best:0};saved[state.source].count++;saved[state.source].best=Math.max(saved[state.source].best,Math.round(100*state.correct/state.items.length));save();app.innerHTML=`<div class="hero"><h1>Runde geschafft!</h1><p>Du hast die ganze Lernrunde geschafft!</p><p>${encouragementText()}</p></div>${state.wrong.length?`<div class="card"><h3>Das kannst du noch üben</h3>${state.wrong.map(x=>`<p>${esc(x.q)} → <strong>${esc(x.a)}</strong></p>`).join('')}</div>`:''}<div class="row"><button class="primary" onclick="home()">Zur Startseite</button><button class="secondary" onclick="${state.source==='vocab'?'vocabMenu()':state.source==='grammar'?'grammarMenu()':'home()'}">Weiterüben</button></div>`;celebrate()}function exam(){let items=shuffle(grammar.flatMap(g=>g.q.map(([q,a])=>({q,a})))).slice(0,12);state={mode:'quiz',source:'exam',topic:'Schularbeitstraining',items,i:0,correct:0,wrong:[],answered:false,attempts:0};renderQuestion()}
